<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="mailto:elia.salerno@issgreppi.it">contattami</a>
    <a href="tel:+0341123456">Chiamami</a>
    <button id="bottoneFuggitivo" style="position: absolute; left: 100px; top: 100px; transition: 0.1s;">
  Cliccami!
</button>

<script>
const btn = document.getElementById('bottoneFuggitivo');

btn.addEventListener('mouseenter', () => {
    // Genera coordinate casuali all'interno della pagina
    const x = Math.random() * (window.innerWidth - btn.offsetWidth);
    const y = Math.random() * (window.innerHeight - btn.offsetHeight);
    
    // Sposta il pulsante prima che il mouse possa cliccarlo
    btn.style.left = `${x}px`;
    btn.style.top = `${y}px`;
});
</script>

</body>
</html>
